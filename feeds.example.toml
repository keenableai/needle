# Example feed override for `keenbench freshstream run --feeds feeds.example.toml`.
# Each [[source]] needs url, source_kind, and topical_domain.
#
#   source_kind:    rss_news | rss_release | rss_blog | rss_paper | rss_social
#                   (rss_paper gets a 168h freshness window; everything else 1h)
#   topical_domain: sports | finance | tech | health | weather | local_civic |
#                   entertainment | gaming | commerce | government | science |
#                   education | travel | automotive | other

[[source]]
url = "https://techcrunch.com/feed/"
source_kind = "rss_news"
topical_domain = "tech"

[[source]]
url = "https://export.arxiv.org/rss/cs.CL"
source_kind = "rss_paper"
topical_domain = "science"

[[source]]
url = "https://hnrss.org/frontpage"
source_kind = "rss_social"
topical_domain = "tech"
