name: Dataset card

on:
  push:
    branches: [main]
    paths: [dataset/README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Upload the Hugging Face dataset card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Upload README.md
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: keenable-ai/needle-results
        run: |
          uv run hf upload "$HF_DATASET" dataset/README.md README.md \
            --repo-type dataset --commit-message "Dataset card from ${GITHUB_SHA::7}"
