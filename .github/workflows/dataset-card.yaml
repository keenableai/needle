name: Dataset card

on:
  push:
    branches: [main]
    paths: [dataset/README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Upload the Hugging Face dataset card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Upload README.md
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx --from 'huggingface-hub>=1.22' hf upload keenable-ai/needle-results \
            dataset/README.md README.md --repo-type dataset \
            --commit-message "Dataset card from ${GITHUB_SHA::7}"
