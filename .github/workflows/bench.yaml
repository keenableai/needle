name: Bench

on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
    - cron: "17 1-5,7-11,13-17,19-23 * * *"
  workflow_dispatch:
    inputs:
      finance:
        description: "Also run finance (regenerates gold)"
        type: boolean
        default: false
      agentic_rare:
        description: "Also run agentic_rare (rare-entity nDCG eval)"
        type: boolean
        default: false
      scholar:
        description: "Also run scholar (regenerates gold)"
        type: boolean
        default: false
      legal:
        description: "Also run legal (regenerates gold)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
  KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
  SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
  SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
  BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
  PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  OCTEN_API_KEY: ${{ secrets.OCTEN_API_KEY }}
  CERAMIC_API_KEY: ${{ secrets.CERAMIC_API_KEY }}
  YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
  KAGI_API_KEY: ${{ secrets.KAGI_API_KEY }}
  JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET: keenable-ai/needle-results
  ENGINES: keenable-realtime,keenable,exa-instant,exa,google,bing,brave,brave-llmcontext,parallel-turbo,parallel,tavily,perplexity,octen,ceramic,you,firecrawl,tinyfish,kagi,jina,claude-search,chatgpt-search

jobs:
  plan:
    name: Plan daily benches
    runs-on: ubuntu-latest
    outputs:
      finance: ${{ steps.plan.outputs.finance }}
      agentic_rare: ${{ steps.plan.outputs.agentic_rare }}
      scholar: ${{ steps.plan.outputs.scholar }}
      legal: ${{ steps.plan.outputs.legal }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          sparse-checkout: |
            data/gold.jsonl
            data/scholar.jsonl
            data/legal.jsonl
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FINANCE: ${{ inputs.finance }}
          AGENTIC_RARE: ${{ inputs.agentic_rare }}
          SCHOLAR: ${{ inputs.scholar }}
          LEGAL: ${{ inputs.legal }}
        run: |
          want() {
            if [ "$SCHEDULE" = "$1" ] || [ "$2" = "true" ]; then echo true
            elif [ -n "$3" ] && [ ! -s "$3" ]; then echo true
            else echo false
            fi
          }
          {
            echo "finance=$(want '17 0 * * *' "$FINANCE" data/gold.jsonl)"
            echo "agentic_rare=$(want '17 6 * * *' "$AGENTIC_RARE" '')"
            echo "scholar=$(want '17 12 * * *' "$SCHOLAR" data/scholar.jsonl)"
            echo "legal=$(want '17 18 * * *' "$LEGAL" data/legal.jsonl)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  news:
    name: news
    runs-on: gke-use5-amd64
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site-data
      - uses: ./.github/actions/setup
      - run: |
          uv run needle news generate --source rss --out fresh.jsonl
          uv run needle news run --queries fresh.jsonl --limit 20 \
            --engines "$ENGINES" --out ndcg.json
      - uses: ./.github/actions/publish
        with:
          args: --ndcg ndcg.json --fresh fresh.jsonl
          daily_args: --news fresh.jsonl --news_report ndcg.json

  finance:
    name: finance
    needs: plan
    if: needs.plan.outputs.finance == 'true'
    runs-on: gke-use5-amd64
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site-data
      - uses: ./.github/actions/setup
      - run: |
          uv run needle finance generate --max-companies 100 --per-company 1 \
            --filingdoc-target 40 --out gold.jsonl
          uv run needle finance run --queries gold.jsonl \
            --limit 120 --engines "$ENGINES" --judge --out recall.json
      - uses: ./.github/actions/publish
        with:
          args: --recall recall.json --gold gold.jsonl
          daily_args: --finance gold.jsonl --finance_report recall.json

  agentic_rare:
    name: agentic_rare
    needs: plan
    if: needs.plan.outputs.agentic_rare == 'true'
    runs-on: gke-use5-amd64
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site-data
      - uses: ./.github/actions/setup
      - run: |
          uv run needle agentic_rare run --limit 100 \
            --engines "$ENGINES" --queries-out agentic_rare.jsonl --out agentic_rare.json
      - uses: ./.github/actions/publish
        with:
          args: --agentic_rare agentic_rare.json --agentic_rare_queries agentic_rare.jsonl
          daily_args: --agentic_rare agentic_rare.json --agentic_rare_queries agentic_rare.jsonl

  scholar:
    name: scholar
    needs: plan
    if: needs.plan.outputs.scholar == 'true'
    runs-on: gke-use5-amd64
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site-data
      - uses: ./.github/actions/setup
      - run: |
          uv run needle scholar generate --age-buckets 7d,30d,1y --per-cell 7 \
            --out scholar.jsonl
          uv run needle scholar run --queries scholar.jsonl \
            --engines "$ENGINES" --num-results 10 --search-concurrency 2 --out scholar.json
      - uses: ./.github/actions/publish
        with:
          args: --scholar scholar.json --scholar-queries scholar.jsonl
          daily_args: --scholar scholar.jsonl --scholar_report scholar.json

  legal:
    name: legal
    needs: plan
    if: needs.plan.outputs.legal == 'true'
    runs-on: gke-use5-amd64
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site-data
      - uses: ./.github/actions/setup
      - run: |
          uv run needle legal generate --per-court 4 --per-title 4 \
            --out legal.jsonl
          uv run needle legal run --queries legal.jsonl \
            --engines "$ENGINES" --out legal.json
      - uses: ./.github/actions/publish
        with:
          args: --legal legal.json --legal-queries legal.jsonl
          daily_args: --legal legal.jsonl --legal_report legal.json

  deploy-pages:
    needs: [news, finance, agentic_rare, scholar, legal]
    if: ${{ !cancelled() && contains(needs.*.result, 'success') }}
    concurrency:
      group: pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yaml
