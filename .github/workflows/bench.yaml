name: Bench

on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
    - cron: "17 1-5,7-11,13-17,19-23 * * *"
  workflow_dispatch:
    inputs:
      companyfill:
        description: "Also run companyfill (regenerates gold)"
        type: boolean
        default: false
      rarestream:
        description: "Also run rarestream (rare-entity RBP eval)"
        type: boolean
        default: false
      scholar:
        description: "Also run scholar (regenerates gold)"
        type: boolean
        default: false
      legal:
        description: "Also run legal (regenerates gold)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bench

env:
  PYTHON_VERSION: "3.11"
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
  KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
  SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
  SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
  BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
  PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  OCTEN_API_KEY: ${{ secrets.OCTEN_API_KEY }}
  CERAMIC_API_KEY: ${{ secrets.CERAMIC_API_KEY }}
  YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET: keenable-ai/keenbench-results
  ENGINES: keenable,exa,exa-instant,google,bing,brave,parallel,parallel-turbo,tavily,perplexity,octen,ceramic,you

jobs:
  bench:
    name: Run benchmarks
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.outcomes.outputs.failed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site-data

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: freshstream (hourly)
        id: freshstream
        continue-on-error: true
        run: |
          uv run keenbench freshstream generate --source rss --out fresh.jsonl
          uv run keenbench freshstream run --queries fresh.jsonl --limit 20 \
            --engines "$ENGINES" --out rbp.json

      - name: companyfill (daily schedule, dispatch opt-in, or gold bootstrap)
        id: companyfill
        continue-on-error: true
        env:
          RUN_COMPANYFILL: ${{ github.event.schedule == '17 0 * * *' || inputs.companyfill == true }}
        run: |
          if [ "$RUN_COMPANYFILL" != "true" ] && [ -s site-data/data/gold.jsonl ]; then
            echo "skipping companyfill"
            exit 0
          fi
          mkdir -p site-data/data
          uv run keenbench companyfill generate --max-companies 100 --per-company 1 \
            --filingdoc-target 40 --out site-data/data/gold.jsonl
          uv run keenbench companyfill run --queries site-data/data/gold.jsonl \
            --limit 120 --engines "$ENGINES" --judge --out recall.json

      - name: rarestream (daily schedule or dispatch opt-in)
        id: rarestream
        continue-on-error: true
        env:
          RUN_RARESTREAM: ${{ github.event.schedule == '17 6 * * *' || inputs.rarestream == true }}
        run: |
          if [ "$RUN_RARESTREAM" != "true" ]; then
            echo "skipping rarestream"
            exit 0
          fi
          uv run keenbench rarestream run --limit 100 \
            --engines "$ENGINES" --out rarestream.json

      - name: scholar (daily schedule, dispatch opt-in, or gold bootstrap)
        id: scholar
        continue-on-error: true
        env:
          RUN_SCHOLAR: ${{ github.event.schedule == '17 12 * * *' || inputs.scholar == true }}
        run: |
          if [ "$RUN_SCHOLAR" != "true" ] && [ -s site-data/data/scholar.jsonl ]; then
            echo "skipping scholar"
            exit 0
          fi
          mkdir -p site-data/data
          uv run keenbench scholar generate --age-buckets 7d,30d,1y --per-cell 7 \
            --out site-data/data/scholar.jsonl
          uv run keenbench scholar run --queries site-data/data/scholar.jsonl \
            --engines "$ENGINES" --num-results 10 --out scholar.json

      - name: legal (daily schedule, dispatch opt-in, or gold bootstrap)
        id: legal
        continue-on-error: true
        env:
          RUN_LEGAL: ${{ github.event.schedule == '17 18 * * *' || inputs.legal == true }}
        run: |
          if [ "$RUN_LEGAL" != "true" ] && [ -s site-data/data/legal.jsonl ]; then
            echo "skipping legal"
            exit 0
          fi
          mkdir -p site-data/data
          uv run keenbench legal generate --per-court 4 --per-title 4 \
            --out site-data/data/legal.jsonl
          uv run keenbench legal run --queries site-data/data/legal.jsonl \
            --engines "$ENGINES" --out legal.json

      - name: Collect bench outcomes
        id: outcomes
        run: |
          failed=""
          if [ "${{ steps.freshstream.outcome }}" = "failure" ]; then failed="$failed freshstream"; fi
          if [ "${{ steps.companyfill.outcome }}" = "failure" ]; then failed="$failed companyfill"; fi
          if [ "${{ steps.rarestream.outcome }}" = "failure" ]; then failed="$failed rarestream"; fi
          if [ "${{ steps.scholar.outcome }}" = "failure" ]; then failed="$failed scholar"; fi
          if [ "${{ steps.legal.outcome }}" = "failure" ]; then failed="$failed legal"; fi
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%MZ)
          base_args="--site site-data --runs-out staged --ts $TS"
          args="$base_args"
          if [ -s rbp.json ]; then
            args="$args --rbp rbp.json --fresh fresh.jsonl"
          fi
          if [ -s recall.json ]; then
            args="$args --recall recall.json --gold site-data/data/gold.jsonl"
          fi
          if [ -s rarestream.json ]; then
            args="$args --rarestream rarestream.json"
          fi
          if [ -s scholar.json ]; then
            args="$args --scholar scholar.json --scholar-queries site-data/data/scholar.jsonl"
          fi
          if [ -s legal.json ]; then
            args="$args --legal legal.json --legal-queries site-data/data/legal.jsonl"
          fi
          if [ "$args" = "$base_args" ]; then
            echo "no reports to publish"
            exit 0
          fi
          uv run python scripts/backfill_overlap.py --site site-data --hours 24 || echo "overlap backfill skipped"
          uv run python scripts/publish_bench.py $args
          uvx --from huggingface_hub hf upload "$HF_DATASET" staged runs \
            --repo-type dataset --commit-message "bench: $TS"
          cp dashboard/index.html site-data/index.html
          touch site-data/.nojekyll
          cd site-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bench: $TS" || echo "nothing to publish"
          git push

  deploy-pages:
    needs: bench
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yaml

  check:
    name: Fail on bench errors
    needs: bench
    if: needs.bench.outputs.failed != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "failed benches: ${{ needs.bench.outputs.failed }}"
          exit 1
