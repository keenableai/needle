name: Bench

on:
  schedule:
    - cron: "17 0 * * *" # daily: freshstream + companyfill with fresh gold
    - cron: "17 1-23 * * *" # hourly: freshstream only
  workflow_dispatch:
    inputs:
      companyfill:
        description: "Also run companyfill (regenerates gold)"
        type: boolean
        default: false
      scholar:
        description: "Also run scholar (regenerates gold)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bench

env:
  PYTHON_VERSION: "3.11"
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
  KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
  SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
  BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
  PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET: keenable-ai/keenbench-results
  # extend the comparison here once the engine exists in the registry
  # (src/keenbench/shared/search/factory.py) and its key is a secret above
  ENGINES: keenable,exa,google,bing,brave,parallel,tavily

jobs:
  bench:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site-data

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: freshstream (hourly)
        run: |
          uv run keenbench freshstream generate --source rss --out fresh.jsonl
          uv run keenbench freshstream run --queries fresh.jsonl --limit 20 \
            --engines "$ENGINES" --out rbp.json

      - name: companyfill (daily schedule, dispatch opt-in, or gold bootstrap)
        env:
          # gate on why the run fired, not the runner's clock — cron fire times drift
          RUN_COMPANYFILL: ${{ github.event.schedule == '17 0 * * *' || inputs.companyfill == true }}
        run: |
          if [ "$RUN_COMPANYFILL" != "true" ] && [ -s site-data/data/gold.jsonl ]; then
            echo "skipping companyfill"
            exit 0
          fi
          mkdir -p site-data/data
          uv run keenbench companyfill generate --max-companies 100 \
            --out site-data/data/gold.jsonl
          uv run keenbench companyfill run --queries site-data/data/gold.jsonl \
            --limit 100 --engines "$ENGINES" --judge --out recall.json

      - name: scholar (daily schedule, dispatch opt-in, or gold bootstrap)
        env:
          RUN_SCHOLAR: ${{ github.event.schedule == '17 0 * * *' || inputs.scholar == true }}
        run: |
          if [ "$RUN_SCHOLAR" != "true" ] && [ -s site-data/data/scholar.jsonl ]; then
            echo "skipping scholar"
            exit 0
          fi
          mkdir -p site-data/data
          uv run keenbench scholar generate --age-buckets 7d,30d,1y --per-cell 7 \
            --out site-data/data/scholar.jsonl
          uv run keenbench scholar run --queries site-data/data/scholar.jsonl \
            --engines "$ENGINES" --num-results 10 --out scholar.json

      - name: Publish
        run: |
          # seeds overlap.jsonl from HF-archived runs; no-op once caught up,
          # non-fatal so HF availability can't block the publish
          uv run python scripts/backfill_overlap.py --site site-data || echo "overlap backfill skipped"
          TS=$(date -u +%Y-%m-%dT%H:%MZ)
          args="--site site-data --runs-out staged --ts $TS --rbp rbp.json --fresh fresh.jsonl"
          if [ -s recall.json ]; then
            args="$args --recall recall.json --gold site-data/data/gold.jsonl"
          fi
          if [ -s scholar.json ]; then
            args="$args --scholar scholar.json --scholar-queries site-data/data/scholar.jsonl"
          fi
          uv run python scripts/publish_bench.py $args
          # staged/ holds exactly this run's <id>/ dir, so the run id has one owner
          # (publish_bench.py); upload before the gh-pages push so runs.json never dangles
          uvx --from huggingface_hub hf upload "$HF_DATASET" staged runs \
            --repo-type dataset --commit-message "bench: $TS"
          cp dashboard/index.html site-data/index.html
          touch site-data/.nojekyll
          cd site-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bench: $TS" || echo "nothing to publish"
          git push

  # Pages is set to workflow-based deploys: the managed branch deploy has a
  # fixed 10-min status timeout that this enterprise's slow Pages propagation
  # routinely exceeds. Deploying ourselves lets us raise it.
  deploy-pages:
    name: Deploy dashboard
    needs: bench
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
