name: Deploy Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Upload and deploy are separate jobs so re-running a failed deploy
  # (`gh run rerun --failed`) does not re-run the upload: a second upload adds
  # another "github-pages" artifact to the run and deploy-pages@v5 then errors
  # ("Multiple artifacts named github-pages ... count is 2"). Split, the rerun
  # reuses the artifact build-pages already produced.
  build-pages:
    name: Upload dashboard artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      # gh-pages holds the published data files; the dashboard HTML lives on the
      # default branch. Overlay it here so every deploy serves the current
      # dashboard/index.html rather than whatever copy is committed on gh-pages.
      - uses: actions/checkout@v4
        with:
          path: _src
          sparse-checkout: dashboard/index.html
          sparse-checkout-cone-mode: false
      - run: |
          cp _src/dashboard/index.html index.html
          rm -rf _src

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # pages-deploy serializes bench-triggered and manual redeploys so they can't
  # race the same environment; no cancel-in-progress (cancelling mid-upload once
  # left two artifacts and errored the site).
  deploy-pages:
    name: Deploy dashboard
    needs: build-pages
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
